name: Build and publish image

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild, so a floating base image and upstream `main` branch
    # both get picked up even without any change to this repo.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ghcr.io/${{ github.repository_owner }}/calibre-mcp:latest
